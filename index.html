<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Labb 2 Grupp 1</title> <!--Här döper vi fliken-->


    <!--UPPGIFT 2-->
    <!--Här specificeras all styliing och utseende på vår box-->
    <style> 
      body {
        font-family: Arial, Helvetica, sans-serif;
      }

      .container {
        max-width: 50rem;
        padding: 5rem;
        margin: 0 auto;
        background-color: lightsteelblue;
        border-radius: 1rem;
      }

      .textfield-group, .checkbox-group {
        display: flex;
        justify-content: left;
        margin-bottom: 1rem;
      }

      .textfield-group__label {
        width: 30%;
        padding: 1rem;
        text-align: left;
        font-size: x-large;
      }

      .textfield {
        flex-grow: 1;
        padding: 0.5rem;
        border: 2px solid darkblue;
        border-radius: 4px;
        margin-left: 1rem;
        font-size: larger;
        box-shadow: 0 8px 8px rgba(0, 0, 0, 0.1);
        border-radius: 0.5rem;
      }
      
      .checkbox-group__label {
       width: 30%;
       padding: 1rem;
       text-align: left;
       font-size: x-large;
       
      }

      .checkbox {
        flex-grow: 0;
        padding: 0.5rem;
        border: 2px solid darkblue;
        border-radius: 4px;
        margin-left: 1rem;
        align-self: center;
        height: 20px;
        width: 20px;
      }

      .button-area {
        text-align: right;
        padding: 0.3rem;
        margin-top: 2rem;
        margin-bottom: 2rem;
        
      }

      #clickButton {
        font-size: x-large;
        background-color: darkblue;
        color: white;
        border: 2px solid white;
        border-radius: 4px;
        cursor: pointer;
        box-shadow: 0 8px 8px rgba(0, 0, 0, 0.1);
        border-radius: 0.5rem;
      }

      #outputDiv {
        width: 100%;
        min-height: 50px;
        padding: 1rem;
        border: 2px solid darkblue;
        border-radius: 4px;
        background-color: lightsteelblue;
        box-sizing: border-box;
      }

      
    </style>
  </head>
  <body>
     <!--Här gör vi en div container som innehåller 3 input element där vi skapar klasser beroendes på vad vi vill att den ska göra. Antingen en textruta eller en checkbox, eller en knapp.
     Via name specifiserar vi vad ämnet handlar om, och via type
  specificerar vi vad det ska vara för typ av ruta - en textruta eller en checkbox.-->
  <div class="container"> 
    <h1>Labb 2 - Grupp 1</h1>

    <div class="textfield-group">
      <label class="textfield-group__label" for="color" >Färg: </label>
      <input class="textfield" id="color" name="color" type="text" />
    </div>

    <div class="textfield-group"> 
      <label class="textfield-group__label" for="content" >Innehåll: </label>
      <input class="textfield" id="content" name="content" type="text" />
    </div>

    <div class="checkbox-group"> 
      <label class="checkbox-group__label" for="divStyle" >Stil på box: </label>
      <input class="checkbox" id="divStyle" name="divStyle" type="checkbox" />
    </div>

<!--Här skapar vi en klickbar knapp som vi lagt i en klass för att kunna hämta den klassen i js filen för att kunna länka den vidare-->
  <div class="button-area">
    <button id="clickButton" class="action-button">Ta bort</button>
  </div>
    
<!--Här är en div för den tomma rutan, som vi kommer länka till i js filen-->
    <div id="outputDiv"></div>

</div>

<!--UPPGIFT 3 Här länkar vi till js filen-->
    <script src ="script.js"></script> 
  </body>
</html>
